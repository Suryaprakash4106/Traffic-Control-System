<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Control System Login</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('traffic.jpg') no-repeat center center/cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 20, 40, 0.75), rgba(0, 10, 20, 0.6));
            z-index: -1;
        }

        .login-container {
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: #fff;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 0.9rem;
            color: #ccc;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            z-index: 1;
        }

        input,
        select {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            outline: none;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus,
        select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        /* DROPDOWN FIX - Makes options visible */
        select {
            appearance: none;
            cursor: pointer;
            background-color: rgba(30, 30, 47, 0.95);
        }

        select option {
            background-color: #1e1e2f;
            color: #ffffff;
            padding: 12px;
        }

        select option:hover {
            background-color: #3a3a4a;
        }

        select:focus {
            background-color: #1e1e2f;
        }

        .role-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border-left: 3px solid #00d2ff;
            min-height: 45px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .captcha-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .captcha-question {
            font-size: 1.1rem;
            font-weight: 600;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            min-width: 80px;
            text-align: center;
            letter-spacing: 2px;
        }

        .captcha-input {
            flex: 1;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            outline: none;
        }

        .captcha-input:focus {
            border-color: #00d2ff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #005c97, #363795);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #006bb3, #4649a8);
        }

        .extra-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .extra-links a {
            color: #00d2ff;
            text-decoration: none;
            transition: 0.3s;
            width: fit-content;
            cursor: pointer;
        }

        .extra-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Toast Notification */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            background: #fff;
            color: #1e293b;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-notification.success {
            border-left: 4px solid #10b981;
        }

        .toast-notification.error {
            border-left: 4px solid #ef4444;
        }

        .toast-notification.info {
            border-left: 4px solid #38bdf8;
        }

        .toast-notification i {
            font-size: 18px;
        }

        .toast-notification.success i {
            color: #10b981;
        }

        .toast-notification.error i {
            color: #ef4444;
        }

        .toast-notification.info i {
            color: #38bdf8;
        }

        .toast-notification .toast-close {
            margin-left: auto;
            cursor: pointer;
            color: #94a3b8;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            color: #fff;
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .modal-header p {
            color: #ccc;
            font-size: 0.9rem;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #fff;
            background: none;
            border: none;
        }

        .reset-step {
            display: none;
        }

        .reset-step.active {
            display: block;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #00c853, #009624);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-reset:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ffaa00;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #00d2ff;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Traffic System</h2>
            <p>Secure Access Portal</p>
        </div>

        <form onsubmit="return handleLogin(event)">

            <!-- Role Selection -->
            <div class="input-group">
                <select id="roleSelect" onchange="updateRoleInfo()">
                    <option value="admin">Admin</option>
                    <option value="police">Traffic Police</option>
                    <option value="operator">Operator</option>
                </select>
                <i class="fas fa-user-shield"></i>
            </div>

            <!-- Dynamic Role Description -->
            <div class="role-info" id="roleInfo">
                <i class="fas fa-info-circle" style="margin-right: 8px;"></i>
                <span id="roleText">Admin → Full system access</span>
            </div>

            <!-- Email -->
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <i class="fas fa-envelope"></i>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>

            <!-- CAPTCHA Verification -->
            <div class="captcha-container">
                <span class="captcha-question" id="captchaQuestion">A1B2C3</span>
                <input type="text" id="captchaInput" class="captcha-input" placeholder="Enter code" maxlength="6" required>
                <i class="fas fa-sync-alt" style="cursor: pointer; color: #00d2ff;" onclick="generateCaptcha()"></i>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-login">LOGIN</button>

            <!-- Forgot Password & Sign Up -->
            <div class="extra-links">
                <a href="#" onclick="openForgotModal(event)">Forgot Password?</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeForgotModal()">&times;</span>
            
            <!-- Step 1: Email Input -->
            <div class="reset-step active" id="step1">
                <div class="modal-header">
                    <h3>Reset Password</h3>
                    <p>Enter your email to receive OTP</p>
                </div>
                <div class="input-group">
                    <input type="email" id="resetEmail" placeholder="Your Email" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <button class="btn-reset" id="sendOtpBtn" onclick="sendResetOTP()">Send OTP</button>
            </div>

            <!-- Step 2: OTP Verification -->
            <div class="reset-step" id="step2">
                <div class="modal-header">
                    <h3>Verify OTP</h3>
                    <p>Enter the 6-digit code sent to your email</p>
                </div>
                <div class="input-group">
                    <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6" required>
                    <i class="fas fa-key"></i>
                </div>
                <div class="timer" id="timer">05:00</div>
                <button class="btn-reset" id="verifyOtpBtn" onclick="verifyResetOTP()">Verify OTP</button>
                <div class="back-link">
                    <a href="#" onclick="resendResetOTP(event)">Resend OTP</a>
                </div>
            </div>

            <!-- Step 3: New Password -->
            <div class="reset-step" id="step3">
                <div class="modal-header">
                    <h3>New Password</h3>
                    <p>Enter your new password</p>
                </div>
                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New Password" required>
                    <i class="fas fa-lock"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button class="btn-reset" id="resetPasswordBtn" onclick="resetPassword()">Reset Password</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== TOAST NOTIFICATION ====================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            
            let icon = '';
            if (type === 'success') icon = '<i class="fas fa-check-circle"></i>';
            else if (type === 'error') icon = '<i class="fas fa-exclamation-circle"></i>';
            else icon = '<i class="fas fa-info-circle"></i>';
            
            toast.innerHTML = `
                ${icon}
                <span>${message}</span>
                <i class="fas fa-times toast-close"></i>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
            
            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.remove();
            });
        }

        // ==================== ROLE DESCRIPTION ====================
        const roleData = {
            admin: "Admin → Full system access",
            police: "Traffic Police → Emergency vehicle & traffic monitoring",
            operator: "Operator → Records & density monitoring"
        };

        const roleSelect = document.getElementById('roleSelect');
        const roleText = document.getElementById('roleText');
        const roleInfo = document.getElementById('roleInfo');

        function updateRoleInfo() {
            const selectedRole = roleSelect.value;
            roleText.innerText = roleData[selectedRole];

            if (selectedRole === 'admin') {
                roleInfo.style.borderLeftColor = "#ff4757";
            } else if (selectedRole === 'police') {
                roleInfo.style.borderLeftColor = "#ffa502";
            } else {
                roleInfo.style.borderLeftColor = "#2ed573";
            }
        }

        // ==================== ALPHANUMERIC CAPTCHA ====================
        let currentCaptchaCode = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            currentCaptchaCode = code;
            document.getElementById('captchaQuestion').textContent = code;
            document.getElementById('captchaInput').value = '';
        }

        function validateCaptcha() {
            const userAnswer = document.getElementById('captchaInput').value;
            return userAnswer === currentCaptchaCode;
        }

        // ==================== LOGIN FUNCTION ====================
        async function handleLogin(event) {
            event.preventDefault();

            if (!validateCaptcha()) {
                showToast('Incorrect CAPTCHA code. Please try again.', 'error');
                generateCaptcha();
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const role = roleSelect.value;

            if (!email || !password) {
                showToast('Please fill all fields', 'error');
                return;
            }

            const btn = document.querySelector('.btn-login');
            const originalText = btn.innerText;
            btn.innerText = "Authenticating...";
            btn.disabled = true;

            try {
                const response = await fetch('https://traffic-control-system-y9s8.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify({
                        email: email,
                        role: data.user?.role || role,
                        name: data.user?.name || email.split('@')[0],
                        isLoggedIn: true
                    }));

                    showToast('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        if (data.user?.role === 'admin' || role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1500);
                } else {
                    showToast('Error: ' + (data.error || 'Login failed'), 'error');
                    generateCaptcha();
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showToast('Connection error: Cannot reach backend server', 'error');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // ==================== FORGOT PASSWORD MODAL ====================
        let resetEmail = '';
        let resetTimer;
        let timeLeft = 300;

        function openForgotModal(event) {
            event.preventDefault();
            document.getElementById('forgotModal').classList.add('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            document.getElementById('resetEmail').value = '';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
            clearInterval(resetTimer);
        }

        async function sendResetOTP() {
            resetEmail = document.getElementById('resetEmail').value.trim();

            if (!resetEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(resetEmail)) {
                showToast('Please enter a valid email', 'error');
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch('https://traffic-control-system-y9s8.onrender.com/send-email-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('OTP sent to your email!', 'success');
                    
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    
                    timeLeft = 300;
                    startResetTimer();
                } else {
                    showToast('Error: ' + (data.error || 'Failed to send OTP'), 'error');
                }
            } catch (error) {
                showToast('Connection error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        }

        function startResetTimer() {
            const timerDisplay = document.getElementById('timer');
            clearInterval(resetTimer);
            
            resetTimer = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(resetTimer);
                    timerDisplay.textContent = 'Expired';
                    document.getElementById('verifyOtpBtn').disabled = true;
                }
            }, 1000);
        }

        async function verifyResetOTP() {
            const otp = document.getElementById('otpInput').value.trim();

            if (!otp || otp.length !== 6) {
                showToast('Please enter 6-digit OTP', 'error');
                return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const response = await fetch('https://traffic-control-system-y9s8.onrender.com/verify-email-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail, otp: otp })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('OTP verified!', 'success');
                    document.getElementById('step2').classList.remove('active');
                    document.getElementById('step3').classList.add('active');
                    clearInterval(resetTimer);
                } else {
                    showToast('Error: ' + (data.error || 'Invalid OTP'), 'error');
                }
            } catch (error) {
                showToast('Connection error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify OTP';
            }
        }

        function resendResetOTP(event) {
            event.preventDefault();
            sendResetOTP();
        }

        async function resetPassword() {
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();

            if (!newPass || newPass.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            if (newPass !== confirmPass) {
                showToast('Passwords do not match', 'error');
                return;
            }

            const btn = document.getElementById('resetPasswordBtn');
            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const response = await fetch('https://traffic-control-system-y9s8.onrender.com/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail, newPassword: newPass })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Password reset successful! Please login.', 'success');
                    setTimeout(() => {
                        closeForgotModal();
                    }, 1500);
                } else {
                    showToast('Error: ' + (data.error || 'Password reset failed'), 'error');
                }
            } catch (error) {
                showToast('Connection error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }

        // ==================== INITIALIZE ====================
        document.addEventListener('DOMContentLoaded', function() {
            updateRoleInfo();
            generateCaptcha();
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('forgotModal');
            if (event.target === modal) {
                closeForgotModal();
            }
        });
    </script>

</body>

</html>
